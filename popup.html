<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelmar Vehicle Scanner</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main class="cockpit">
    <header>
      <img src="icons/kelmar-logo.png" width="96" height="44" alt="Kelmar Vehicles Ltd">
      <div><h1>Vehicle Scanner</h1><p class="connection"><span id="connectionDot" aria-hidden="true"></span><span id="connectionStatus">Checking dashboard…</span><span id="version"></span></p></div>
      <button id="openDashboard" class="icon" type="button" aria-label="Open sourcing dashboard" title="Open sourcing dashboard">↗</button>
    </header>

    <div id="warnings" class="warnings" aria-live="polite"></div>

    <section class="source-card" aria-labelledby="sourceHeading">
      <div class="title-row"><div><p class="eyebrow">Filter source</p><h2 id="sourceHeading">Saved search</h2></div><button id="refreshSearches" class="quiet" type="button">Refresh</button></div>
      <label class="sr-only" for="savedSearch">Active filter source</label><select id="savedSearch"><option value="">Local filter draft</option></select>
      <p id="sourceStatus" class="helper">Loading active filters…</p>
      <details class="summary"><summary><span id="summaryHeadline">View filter summary</span></summary><div id="filterSummary"></div></details>
      <button id="openSettings" class="settings-button" type="button">Open full settings</button>
    </section>

    <section class="counters" aria-label="Live scan progress">
      <div><strong id="discovered">0</strong><span>Found</span></div><div><strong id="queued">0</strong><span>Queued</span></div><div><strong id="inspecting">0</strong><span>Checking</span></div><div><strong id="matched">0</strong><span>Matched</span></div>
      <div><strong id="rejected">0</strong><span>Rejected</span></div><div><strong id="unresolved">0</strong><span>Unresolved</span></div><div><strong id="pendingUpload">0</strong><span>To upload</span></div><div><strong id="uploaded">0</strong><span>Uploaded</span></div>
    </section>

    <details id="reasonSection" class="reason-card" hidden><summary>Recent rejection reasons</summary><ol id="reasonCounts"></ol></details>
    <p id="status" class="run-status" aria-live="polite">Ready.</p>

    <section class="actions" aria-label="Scan controls">
      <button id="startScan" class="primary" type="button">Start</button><button id="pauseScan" type="button">Pause</button><button id="resumeScan" type="button">Resume</button><button id="stopScan" class="danger" type="button">Stop</button>
    </section>
    <div class="utility"><button id="openResults" type="button">Open results</button><button id="retrySync" type="button">Retry upload</button><button id="discardScan" type="button">Discard interrupted run</button></div>
  </main>
  <script src="vehicle-catalogue.js"></script><script src="filter-domain.js"></script><script src="scanner-decision-policy.js"></script><script src="settings-storage.js"></script><script src="popup.js"></script>
</body>
</html>
